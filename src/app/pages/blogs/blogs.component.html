<section class="blogs-page">
  <div class="blog-hero-section">
    <h1>Our Blog</h1>
    <p>Insights and updates from our team</p>
  </div>

  <div class="blogs-grid">
    <article class="blog-card" *ngFor="let post of blogPosts">
      <div class="blog-image">
        <!-- <img [src]="post.image" [alt]="post.title"> -->
      </div>
      <div class="blog-content">
        <div class="blog-meta">
          <span class="date">{{ post.date | date:'mediumDate' }}</span>
          <span class="author">By {{ post.author }}</span>
        </div>
        <h2>{{ post.title }}</h2>
        <p>{{ post.excerpt }}</p>
        <div class="blog-tags">
          <span class="blog-tag" *ngFor="let tag of post.tags">{{ tag }}</span>
        </div>
        <a [routerLink]="['/blog', post.id]" class="read-more">Read More →</a>
      </div>
    </article>
  </div>
</section>
